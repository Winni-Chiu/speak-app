<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f5e">
<title>說說看</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <!-- ========== 首頁 ========== -->
  <section id="scr-home" class="screen active" aria-label="首頁">
    <h1 class="title">說說看</h1>
    <button id="goAll" class="home-btn hb-all" type="button">
      <span class="hb-icon">🗣️</span><span class="hb-text">開始練習</span><span class="hb-count" id="cntAll"></span>
    </button>
    <button id="goBad" class="home-btn hb-bad" type="button">
      <span class="hb-icon">🔁</span><span class="hb-text">練習念錯的</span><span class="hb-count" id="cntBad"></span>
    </button>
    <button id="goGood" class="home-btn hb-good" type="button">
      <span class="hb-icon">⭐</span><span class="hb-text">複習念對的</span><span class="hb-count" id="cntGood"></span>
    </button>
    <div class="home-small">
      <button id="goWords" class="mid" type="button">📚 詞庫</button>
      <button id="goSettings" class="mid" type="button">⚙️ 設定</button>
    </div>
  </section>

  <!-- ========== 練習 ========== -->
  <section id="scr-practice" class="screen" aria-label="練習">
    <div class="topbar">
      <button class="home-link" type="button" data-home>🏠 回首頁</button>
      <span id="progress" class="progress"></span>
    </div>

    <div class="card">
      <button id="wordText" class="word" type="button" aria-label="點一下聽發音"></button>
    </div>

    <div id="result" class="result" aria-live="assertive" hidden></div>

    <div class="actions">
      <button id="btnListen" class="big btn-listen" type="button">🔊 聽</button>
      <button id="btnSpeak" class="big btn-speak" type="button">🎤 我來說</button>
    </div>

    <div class="nav-row">
      <button id="btnPrev" class="nav-btn" type="button">◀ 上一個</button>
      <button id="btnNext" class="nav-btn" type="button">下一個 ▶</button>
    </div>
  </section>

  <!-- ========== 練完了 ========== -->
  <section id="scr-done" class="screen" aria-label="練完了">
    <div class="done-box">
      <div class="done-icon">🎉</div>
      <h1>這一輪練完了！</h1>
      <p id="doneText" class="done-text"></p>
    </div>
    <button id="doneBad" class="home-btn hb-bad" type="button"><span class="hb-icon">🔁</span><span class="hb-text">練習念錯的</span></button>
    <button id="doneAgain" class="home-btn hb-all" type="button"><span class="hb-icon">↻</span><span class="hb-text">再練一次</span></button>
    <button class="home-btn hb-plain" type="button" data-home><span class="hb-icon">🏠</span><span class="hb-text">回首頁</span></button>
  </section>

  <!-- ========== 詞庫 ========== -->
  <section id="scr-words" class="screen" aria-label="詞庫">
    <div class="topbar"><button class="home-link" type="button" data-home>🏠 回首頁</button></div>
    <h1>詞庫</h1>
    <button id="btnAdd" class="big btn-speak full" type="button">＋ 新增詞語</button>
    <ul id="wordList" class="word-list"></ul>

    <details class="panel">
      <summary>備份 / 還原</summary>
      <div class="row-wrap">
        <button id="btnExport" class="mid" type="button">⬇ 匯出詞庫</button>
        <label class="mid filebtn">⬆ 匯入詞庫<input id="fileImport" type="file" accept=".json,application/json" hidden></label>
        <button id="btnResetStatus" class="mid ghost" type="button">全部改回「還沒練」</button>
      </div>
    </details>
  </section>

  <!-- ========== 設定 ========== -->
  <section id="scr-settings" class="screen" aria-label="設定">
    <div class="topbar"><button class="home-link" type="button" data-home>🏠 回首頁</button></div>
    <h1>設定</h1>

    <div class="panel">
      <label class="lbl" for="rate">唸的速度：<b id="rateVal"></b></label>
      <input id="rate" type="range" min="0.4" max="1.2" step="0.1">
      <button id="btnTestVoice" class="mid" type="button">🔊 試聽</button>
    </div>

    <div class="panel">
      <div class="lbl">字的大小</div>
      <div class="seg" role="radiogroup" id="sizeSeg">
        <button type="button" data-v="L">大</button>
        <button type="button" data-v="XL">特大</button>
      </div>
    </div>

    <div class="panel">
      <div class="lbl">判斷標準</div>
      <div class="seg" role="radiogroup" id="strictSeg">
        <button type="button" data-v="easy">寬鬆</button>
        <button type="button" data-v="normal">一般</button>
        <button type="button" data-v="strict">嚴格</button>
      </div>
      <p class="small">用「拼音」判斷，同音字也算對。<br>寬鬆：說對一半、音接近（例如 ㄓ/ㄗ、ㄣ/ㄥ 不分）就算對。<br>一般：大部分說對，聲調錯一點沒關係。<br>嚴格：每個字的音和聲調都要對。</p>
    </div>

    <div class="panel">
      <label class="switch"><input id="autoSpeak" type="checkbox"> 出現新的詞時，先唸一次</label>
      <label class="switch"><input id="voiceFeedback" type="checkbox"> 用語音鼓勵、說出對或不對</label>
      <label class="switch"><input id="autoReplay" type="checkbox"> 說錯時再唸一次正確發音</label>
      <label class="switch"><input id="autoNext" type="checkbox"> 說對後自動換下一個</label>
      <label class="switch"><input id="shuffle" type="checkbox"> 隨機順序</label>
    </div>

    <div class="panel">
      <div class="lbl">語言</div>
      <select id="lang">
        <option value="zh-TW">國語（台灣）</option>
        <option value="zh-CN">普通話（中國）</option>
        <option value="zh-HK">粵語（香港）</option>
        <option value="en-US">English</option>
      </select>
    </div>

    <div class="panel">
      <div class="lbl">離線語音辨識</div>
      <p id="offlineStatus" class="small">檢查中…</p>
      <button id="btnInstallOffline" class="mid" type="button" hidden>⬇ 下載離線語音辨識</button>
    </div>
  </section>
</main>

<dialog id="addDlg">
  <form method="dialog" id="addForm">
    <h2>新增詞語</h2>
    <p class="small">每一格填一個要練習的詞，空白的格子不會加入。</p>
    <div id="addRows" class="add-rows"></div>
    <button id="btnMoreRow" class="mid full-w" type="button">＋ 再多一格</button>
    <div class="row-wrap dlg-actions">
      <span class="spacer"></span>
      <button value="cancel" class="mid ghost" formnovalidate>取消</button>
      <button value="save" class="mid btn-speak">全部加入</button>
    </div>
  </form>
</dialog>

<dialog id="editDlg">
  <form method="dialog" id="editForm">
    <h2>修改詞語</h2>
    <input id="fText" required maxlength="30" autocomplete="off" aria-label="要練習的詞">
    <div class="row-wrap dlg-actions">
      <button id="fDelete" class="mid danger" type="button">刪除</button>
      <span class="spacer"></span>
      <button value="cancel" class="mid ghost" formnovalidate>取消</button>
      <button id="fSave" value="save" class="mid btn-speak">儲存</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="status" hidden></div>

<script src="pinyin-pro.js"></script>
<script src="app.js"></script>
</body>
</html>
