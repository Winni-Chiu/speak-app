plugins {
    id 'com.android.application'
}

// GitHub Actions 每次建置的編號，讓新版可以直接覆蓋安裝
def buildNo = (project.findProperty('versionCode') ?: '1').toString().toInteger()

android {
    namespace 'tw.speakapp.practice'
    compileSdk 34

    defaultConfig {
        applicationId 'tw.speakapp.practice'
        minSdk 24
        targetSdk 34
        versionCode buildNo
        versionName "1.0.${buildNo}"
    }

    signingConfigs {
        release {
            storeFile file('../speak.keystore')
            storePassword 'speakapp'
            keyAlias 'speak'
            keyPassword 'speakapp'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
